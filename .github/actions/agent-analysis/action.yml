name: Agent Analysis (Composite)
description: Run an agenthood member analysis and post findings as a PR comment

inputs:
  agent-name:
    description: Agenthood member name (e.g. the-warden)
    required: true
  prompt-template:
    description: Prompt template for analysis. Use %s for the file list.
    required: true
  pr-number:
    description: Pull request number
    required: true
  range:
    description: Git diff range (base...head). E.g. main...HEAD
    required: true
  max-files:
    description: Maximum number of changed files to include in the analysis prompt
    required: false
    default: "15"
  include-diff:
    description: Append the full git diff (capped at 100KB) to the prompt as untrusted data
    required: false
    default: "false"
  api-key:
    description: OPENCODE_API_KEY for agent analysis
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: "24"
        cache: npm
    - shell: bash
      env:
        AGENT_NAME: ${{ inputs.agent-name }}
        PR_NUMBER: ${{ inputs.pr-number }}
        PROMPT_TEMPLATE: ${{ inputs.prompt-template }}
        RANGE: ${{ inputs.range }}
        MAX_FILES: ${{ inputs.max-files }}
        INCLUDE_DIFF: ${{ inputs.include-diff }}
        OPENCODE_API_KEY: ${{ inputs.api-key }}
        GH_TOKEN: ${{ github.token }}
      run: .github/scripts/agent-analysis.sh
