name: Setup Node Environment
description: Install Node and run npm ci (run after actions/checkout)

inputs:
  node-version:
    description: Node version to install
    required: false
    default: "24"
  install-args:
    description: Extra args for npm ci
    required: false
    default: "--ignore-scripts"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - run: npm ci ${{ inputs.install-args }}
      shell: bash
