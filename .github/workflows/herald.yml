name: The Herald — CI Summary

on:
  workflow_run:
    # Keep in sync with TRIGGER_WORKFLOWS in .github/scripts/herald-summary.cjs —
    # parity is enforced by tests/unit/scripts/herald-summary.test.ts
    workflows:
      - Society — PR Standards
      - The Envoy — VS Code Extension Build and Test
      - The Reviewer — Commit Review
    types:
      - completed

# Three scopes are required: `pull-requests: write` covers PR metadata;
# `issues: write` is needed because PR comments are created through the Issues
# API (issues.listComments/createComment/updateComment); `actions: read` is
# needed to list the triggering workflows' runs (actions.listWorkflowRunsForRepo).
permissions:
  pull-requests: write
  issues: write
  actions: read

concurrency:
  # Keyed on the head SHA alone so two triggers completing near-simultaneously
  # cancel each other instead of racing to post duplicate verdict comments
  group: herald-ci-summary-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  summarize:
    if: github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # workflow_run events run on a fresh workspace — checkout the default
      # branch so the summary script exists before requiring it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { summarize } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/herald-summary.cjs`)
            await summarize(context, github)
