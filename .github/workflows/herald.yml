name: The Herald — CI Summary

on:
  workflow_run:
    workflows:
      - Society — PR Standards
      - The Envoy — VS Code Extension Build and Test
      - The Reviewer — Commit Review
    types:
      - completed

# Both scopes are required: `pull-requests: write` covers PR metadata, and
# `issues: write` is needed because PR comments are created through the Issues
# API (issues.listComments/createComment/updateComment in herald-summary.cjs).
permissions:
  pull-requests: write
  issues: write

concurrency:
  group: herald-ci-summary-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.workflow }}
  cancel-in-progress: true

jobs:
  summarize:
    if: github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      # workflow_run events run on a fresh workspace — checkout the default
      # branch so the summary script exists before requiring it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { summarize } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/herald-summary.cjs`)
            await summarize(context, github)
