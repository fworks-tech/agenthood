name: OpenCode Catalog Sync

env:
  # Anchored to the tracking issue. Fixed, not label-searched: the workflow owns
  # exactly one long-lived PR, and a search could match a different issue and
  # split the branch.
  SYNC_ISSUE: "1098"

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: opencode-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run sync:opencode-catalog

      - name: Open or update the sync PR when the catalog changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/llm/providers/opencode-catalog.json; then
            echo "OpenCode catalog unchanged"
            exit 0
          fi
          branch="chore/issue-${SYNC_ISSUE}-opencode-catalog-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add src/llm/providers/opencode-catalog.json
          git commit -m "chore(llm): sync OpenCode model catalog"
          git push --force-with-lease origin "$branch"
          # The body links the tracking issue; edited on every run so an existing
          # PR cannot keep a stale body from before the issue was anchored.
          body=$(printf 'Automated refresh of src/llm/providers/opencode-catalog.json from https://opencode.ai/zen/v1/models and https://opencode.ai/zen/go/v1/models. Prices, protocols and context windows follow the live catalog.\n\nRefs #%s, the tracking issue for this refresh.' "$SYNC_ISSUE")
          if [ -z "$(gh pr list --head "$branch" --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head "$branch" \
              --title "chore(llm): sync OpenCode model catalog" \
              --body "$body"
          else
            gh pr edit "$branch" --body "$body"
          fi
