name: Society — PR Standards

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ──────────────────────────────────────────────
  # The Doorman — PR standards (commits + body)
  # ──────────────────────────────────────────────
  commitlint:
    name: The Doorman — PR Standards Validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-env
        with:
          install-args: "--ignore-scripts --no-audit"
      - name: The Doorman — validate commits in PR range
        env:
          NODE_OPTIONS: "--import tsx"
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx commitlint \
            --config docs/conventions/commitlint.config.ts \
            --from "$BASE_SHA" \
            --to "$HEAD_SHA" \
            --verbose
      - name: The Doorman — PR body must link to an issue
        # Drafts and bot PRs (Dependabot/Renovate) skip the gate: drafts are
        # WIP by definition and bots do not author Closes footers.
        if: github.event.pull_request.draft == false && github.event.pull_request.user.type != 'Bot'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/pr-body-check.sh

  # ──────────────────────────────────────────────
  # The Auditor — Gitleaks secret scanning
  # ──────────────────────────────────────────────
  gitleaks:
    name: The Auditor — Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Warn if private repo without license
        if: github.event.repository.private == true
        run: |
          if [ -z "$GITLEAKS_LICENSE" ]; then
            echo "::warning::The Auditor: private repo and GITLEAKS_LICENSE not set."
          fi
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE || '' }}
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE || '' }}
      - name: The Auditor — post findings to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # YAML literal blocks strip the common indentation before the shell
          # sees them, so `EOF` and the markdown body land at column 0 — the
          # heredoc is well-formed. The body is piped (stdin) so workflow
          # expressions and markdown are never interpolated into the gh args.
          cat <<'EOF' | .github/scripts/post-pr-comment.sh ${{ github.event.pull_request.number }}
          ## The Auditor — Secret Scan :warning:

          Potential secrets or configuration issues were detected. Review the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

          *-- The Auditor, Agenthood*
          EOF
      - name: The Auditor — agent analysis
        if: github.event_name == 'pull_request'
        # Sends changed-file names to an external LLM provider.
        # Data handling and opt-out: docs/governance/agent-analysis-data.md
        uses: ./.github/actions/agent-analysis
        with:
          agent-name: the-auditor
          prompt-template: "audit these changed files for security concerns, secrets, and dependency risks. Be concise — use bullet points, keep under 40 lines. Report blocking findings and at most 2 action-needed warnings; classify minor style, nit, and accepted-and-documented residual items as notes, not warnings.\n%s"
          pr-number: ${{ github.event.pull_request.number }}
          range: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
          max-files: "15"
          api-key: ${{ secrets.OPENCODE_API_KEY }}

  # ──────────────────────────────────────────────
  # The Scribe — auto-label PR by changed files
  # ──────────────────────────────────────────────
  labeler:
    name: The Scribe — PR Labeler
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # The Warden — file size enforcement
  # ──────────────────────────────────────────────
  filesize:
    name: The Warden — File Size Enforcement
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: The Warden — enforce file size limits
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/filesize-check.sh
      - name: The Warden — agent analysis
        # Sends changed-file names to an external LLM provider.
        # Data handling and opt-out: docs/governance/agent-analysis-data.md
        uses: ./.github/actions/agent-analysis
        with:
          agent-name: the-warden
          prompt-template: "analyze these changed files for code smells, complexity issues, and architectural decay. Be concise — use bullet points, keep under 40 lines. Report blocking violations and at most 2 action-needed warnings; classify minor style, nit, line-length, and documented-target observations as notes, not warnings.\n%s"
          pr-number: ${{ github.event.pull_request.number }}
          range: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
          max-files: "25"
          api-key: ${{ secrets.OPENCODE_API_KEY }}

  # ──────────────────────────────────────────────
  # The Librarian — documentation sync check
  # ──────────────────────────────────────────────
  librarian:
    name: The Librarian — Documentation Sync
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: The Librarian — verify docs reflect changed files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/librarian-check.sh
      - name: The Librarian — post doc sync report to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # see the Auditor step above for why the heredoc/pipe is safe here
          cat <<'EOF' | .github/scripts/post-pr-comment.sh ${{ github.event.pull_request.number }}
          ## The Librarian — Documentation Check :warning:

          Documentation may be out of sync with code changes. Review the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

          *-- The Librarian, Agenthood*
          EOF

  # ──────────────────────────────────────────────
  # The Sentinel — member file structure
  # ──────────────────────────────────────────────
  sentinel:
    name: The Sentinel — Member File Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: The Sentinel — run all member structure checks
        shell: bash
        run: .github/scripts/sentinel-check.sh
      - name: The Sentinel — agent analysis
        # Sends changed-file names to an external LLM provider.
        # Data handling and opt-out: docs/governance/agent-analysis-data.md
        uses: ./.github/actions/agent-analysis
        with:
          agent-name: the-sentinel
          prompt-template: "analyze these changed member files for structural drift and consistency issues. Be concise — use bullet points, keep under 40 lines.\n%s"
          pr-number: ${{ github.event.pull_request.number }}
          range: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
          max-files: "10"
          api-key: ${{ secrets.OPENCODE_API_KEY }}

  # ──────────────────────────────────────────────
  # The Tester — test suite
  # ──────────────────────────────────────────────
  # ──────────────────────────────────────────────
  # The Auditor — dependency audit
  # ──────────────────────────────────────────────
  audit:
    name: The Auditor — Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-env
      - name: The Auditor — audit project dependencies
        shell: bash
        run: .github/scripts/audit-check.sh

  # ──────────────────────────────────────────────
  # The Tester — test suite
  # ──────────────────────────────────────────────
  tests:
    name: The Tester — Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-env
      - name: The Tester — run affected tests
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/test-runner.sh

  # ──────────────────────────────────────────────
  # The Warden — lint and typecheck gates
  # ──────────────────────────────────────────────
  lint-typecheck:
    name: The Warden — Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-env
      - name: The Warden — lint
        run: npm run lint
      - name: The Warden — typecheck
        run: npm run typecheck
      - name: The Warden — build
        run: npm run build

  # ──────────────────────────────────────────────
  # The Envoy — package smoke test
  # ──────────────────────────────────────────────
  packaging:
    name: The Envoy — Package Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-env
      - name: The Envoy — pack, scratch install, and CLI check
        shell: bash
        run: .github/scripts/package-smoke.sh
