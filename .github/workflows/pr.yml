name: Society — PR Standards

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ──────────────────────────────────────────────
  # The Doorman — commit message validation
  # ──────────────────────────────────────────────
  commitlint:
    name: The Doorman — Commit Message Validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - name: The Doorman — validate commits in PR range
        env:
          NODE_OPTIONS: "--import tsx"
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx commitlint \
            --config docs/conventions/commitlint.config.ts \
            --from "$BASE_SHA" \
            --to "$HEAD_SHA" \
            --verbose

  # ──────────────────────────────────────────────
  # The Auditor — Gitleaks secret scanning
  # ──────────────────────────────────────────────
  gitleaks:
    name: The Auditor — Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Warn if private repo without license
        if: github.event.repository.private == true
        run: |
          if [ -z "$GITLEAKS_LICENSE" ]; then
            echo "::warning::The Auditor: private repo and GITLEAKS_LICENSE not set."
          fi
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE || '' }}
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE || '' }}
      - name: The Auditor — post findings to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat <<'EOF' | .github/scripts/post-pr-comment.sh ${{ github.event.pull_request.number }}
          ## The Auditor — Secret Scan :warning:

          Potential secrets or configuration issues were detected. Review the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

          *-- The Auditor, Agenthood*
          EOF
      - name: The Auditor — agent analysis
        if: github.event_name == 'pull_request'
        # Sends changed-file names to an external LLM provider.
        # Data handling and opt-out: docs/governance/agent-analysis-data.md
        uses: ./.github/actions/agent-analysis
        with:
          agent-name: the-auditor
          prompt-template: "audit these changed files for security concerns, secrets, and dependency risks. Be concise — use bullet points, keep under 40 lines.\n%s\n\nEnd your report with: <!--AGENTHOOD_DECISION: blocking=true warnings=N--> or <!--AGENTHOOD_DECISION: blocking=false warnings=N-->"
          pr-number: ${{ github.event.pull_request.number }}
          range: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
          max-files: "15"
          api-key: ${{ secrets.OPENCODE_API_KEY }}

  # ──────────────────────────────────────────────
  # The Scribe — auto-label PR by changed files
  # ──────────────────────────────────────────────
  labeler:
    name: Society — PR Labeler
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # The Warden — file size enforcement
  # ──────────────────────────────────────────────
  filesize:
    name: The Warden — File Size Enforcement
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: The Warden — enforce file size limits
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/filesize-check.sh
      - name: The Warden — agent analysis
        # Sends changed-file names to an external LLM provider.
        # Data handling and opt-out: docs/governance/agent-analysis-data.md
        uses: ./.github/actions/agent-analysis
        with:
          agent-name: the-warden
          prompt-template: "analyze these changed files for code smells, complexity issues, and architectural decay. Be concise — use bullet points, keep under 40 lines.\n%s\n\nEnd your report with: <!--AGENTHOOD_DECISION: blocking=true warnings=N--> or <!--AGENTHOOD_DECISION: blocking=false warnings=N-->"
          pr-number: ${{ github.event.pull_request.number }}
          range: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
          max-files: "25"
          api-key: ${{ secrets.OPENCODE_API_KEY }}

  # ──────────────────────────────────────────────
  # The Librarian — documentation sync check
  # ──────────────────────────────────────────────
  librarian:
    name: The Librarian — Documentation Sync
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: The Librarian — verify docs reflect changed files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/librarian-check.sh
      - name: The Librarian — post doc sync report to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat <<'EOF' | .github/scripts/post-pr-comment.sh ${{ github.event.pull_request.number }}
          ## The Librarian — Documentation Check :warning:

          Documentation may be out of sync with code changes. Review the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

          *-- The Librarian, Agenthood*
          EOF

  # ──────────────────────────────────────────────
  # The Sentinel — member file structure
  # ──────────────────────────────────────────────
  sentinel:
    name: The Sentinel — Member File Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: The Sentinel — run all member structure checks
        shell: bash
        run: .github/scripts/sentinel-check.sh
      - name: The Sentinel — agent analysis
        # Sends changed-file names to an external LLM provider.
        # Data handling and opt-out: docs/governance/agent-analysis-data.md
        uses: ./.github/actions/agent-analysis
        with:
          agent-name: the-sentinel
          prompt-template: "analyze these changed member files for structural drift and consistency issues. Be concise — use bullet points, keep under 40 lines.\n%s\n\nEnd your report with: <!--AGENTHOOD_DECISION: blocking=true warnings=N--> or <!--AGENTHOOD_DECISION: blocking=false warnings=N-->"
          pr-number: ${{ github.event.pull_request.number }}
          range: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
          max-files: "10"
          api-key: ${{ secrets.OPENCODE_API_KEY }}

  # ──────────────────────────────────────────────
  # The Tester — test suite
  # ──────────────────────────────────────────────
  tests:
    name: The Tester — Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: The Auditor — audit project dependencies
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit.json 2>/dev/null || true
          real=$(node -e "
            const a = JSON.parse(require('fs').readFileSync('/tmp/npm-audit.json', 'utf8'));
            const bad = Object.values(a.vulnerabilities || {})
              .filter(v => (v.severity === 'high' || v.severity === 'critical')
                && (v.nodes || []).some(n => !n.startsWith('node_modules/npm')));
            for (const v of bad) console.log(v.name + ' [' + v.severity + '] ' + (v.nodes || []).join(', '));
          ")
          if [ -n "$real" ]; then
            echo "The Auditor: unfixed high/critical vulnerabilities in project dependencies:"
            echo "$real"
            exit 1
          fi
          echo "The Auditor: no high/critical vulnerabilities outside npm's bundled dependencies."
      - name: The Tester — run affected tests
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/test-runner.sh

  # ──────────────────────────────────────────────
  # The Warden — lint and typecheck gates
  # ──────────────────────────────────────────────
  lint-typecheck:
    name: The Warden — Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: The Warden — lint
        run: npm run lint
      - name: The Warden — typecheck
        run: npm run typecheck
      - name: The Warden — build
        run: npm run build

  # ──────────────────────────────────────────────
  # The Envoy — package smoke test
  # ──────────────────────────────────────────────
  packaging:
    name: The Envoy — Package Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: The Envoy — pack, scratch install, and CLI check
        shell: bash
        run: .github/scripts/package-smoke.sh
