name: The Envoy — VS Code Extension Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  publish:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    env:
      VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"

      - name: Install dependencies
        run: cd vscode-extension && npm ci

      - run: cd vscode-extension && npm audit --audit-level=high || echo "::warning::publish-vsce npm audit found vulnerabilities"

      - name: Publish to Marketplace
        # --no-install: use the lockfile-pinned @vscode/vsce installed by
        # npm ci - never a fresh, unpinned fetch from the registry
        # A missing token skips the publish instead of failing the release:
        # the job runs on `release: published`, and a guaranteed red after
        # the tag trains everyone to ignore it.
        if: env.VSCE_TOKEN != ''
        run: cd vscode-extension && npx --no-install @vscode/vsce publish
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}

      - name: Report the unpublished extension
        # The notice only lives in this run's log, which nobody opens on a
        # green job. The open issue is the durable signal; close it by hand
        # once the secret exists and the publish has run.
        if: env.VSCE_TOKEN == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::notice::VSCE_TOKEN is not set - the extension was not published."
          open_issues=$(gh issue list --state open --search "VSCE_TOKEN missing in:title" --json number -q 'length')
          if [ "$open_issues" -eq 0 ]; then
            gh issue create --title "VSCE_TOKEN missing: the VS Code extension is not published" \
              --body "A \`publish-vsce\` run skipped the marketplace publish because the \`VSCE_TOKEN\` repository secret does not exist. The GitHub release and the npm package are unaffected. Fix: add the \`VSCE_TOKEN\` secret (a Marketplace token from a publisher with the \`agenthood-vscode\` extension), then dispatch \`publish-vsce.yml\`. Close this issue when the extension is listed on the Marketplace."
          fi
