name: The Envoy — VS Code Extension Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Install dependencies
        run: cd vscode-extension && npm ci

      - run: cd vscode-extension && npm audit --audit-level=high || echo "::warning::publish-vsce npm audit found vulnerabilities"

      - name: Publish to Marketplace
        # --no-install: use the lockfile-pinned @vscode/vsce ^3.0.0 installed by
        # npm ci — never a fresh, unpinned 2.x fetch from the registry
        run: cd vscode-extension && npx --no-install @vscode/vsce publish
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
