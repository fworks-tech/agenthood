name: The Rituals — Scheduled Watches

# Schedules are declared in docs/rituals/*.md frontmatter. Parity is enforced
# by tests/unit/scripts/rituals-workflow.test.ts - edit the manifests together.

on:
  schedule:
    - cron: '0 8 * * 1-5' # morning-briefing: herald
    - cron: '0 9 * * 1-5' # the-inspection: doorman
    - cron: '0 18 * * 1-5' # evening-report: herald
    - cron: '0 */2 * * *' # the-watchman: doorman
  workflow_dispatch:
    inputs:
      ritual:
        description: Ritual to run (morning-briefing | inspection | evening-report | watchman)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # One run per schedule - a late run of the same ritual replaces a still-running one
  group: rituals-${{ github.event.schedule || inputs.ritual }}
  cancel-in-progress: true

jobs:
  ritual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: morning-briefing
            schedule: '0 8 * * 1-5'
            member: herald
            task: >-
              Run the Morning Briefing ritual: from the measured facts below,
              produce the Morning Briefing report in the format defined in
              docs/rituals/morning-briefing.md. Flag idle uncommitted work and
              branches idle longer than 2 hours.
          - name: inspection
            schedule: '0 9 * * 1-5'
            member: doorman
            task: >-
              Run The Inspection ritual: from the measured facts below, produce
              the Daily Inspection report in the format defined in
              docs/rituals/inspection.md.
          - name: evening-report
            schedule: '0 18 * * 1-5'
            member: herald
            task: >-
              Run the Evening Report ritual: from the measured facts below,
              produce the Evening Report with day stats in the format defined
              in docs/rituals/evening-report.md.
          - name: watchman
            schedule: '0 */2 * * *'
            member: doorman
            task: >-
              Run The Watchman ritual: from the measured facts below, produce
              the Watchman Alert in the format defined in
              docs/rituals/watchman.md; if nothing exceeds thresholds, report
              that all is quiet.
    steps:
      # Job-level `if:` cannot use the matrix context (GitHub rejects the whole
      # workflow file - zero-job runs failing on every push to main), so the
      # entry selection happens here, where matrix is available, and the rest
      # of the steps honor the gate output.
      - name: Select matching ritual entry
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_RITUAL: ${{ inputs.ritual }}
          ENTRY_NAME: ${{ matrix.name }}
          ENTRY_SCHEDULE: ${{ matrix.schedule }}
        run: |
          should_run=false
          if [ "$EVENT_NAME" = "schedule" ] && [ "$EVENT_SCHEDULE" = "$ENTRY_SCHEDULE" ]; then
            should_run=true
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_RITUAL" = "$ENTRY_NAME" ]; then
            should_run=true
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.gate.outputs.should_run == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: steps.gate.outputs.should_run == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Run ritual
        if: steps.gate.outputs.should_run == 'true'
        env:
          RITUAL_NAME: ${{ matrix.name }}
          MEMBER: ${{ matrix.member }}
          TASK: ${{ matrix.task }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # qwen3.8-flash speaks the messages protocol, and OpenCodeProvider
          # now sends x-api-key, the header that endpoint reads (the old
          # Bearer token was ignored). It stays because it is the cheapest
          # paid model in the catalog: the watchman dispatch measured
          # $0.0042 against $0.0161 on deepseek-v4.1-flash.
          OPENCODE_MODEL: qwen3.8-flash
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if [ -z "${OPENCODE_API_KEY:-}" ]; then
            echo "::notice::OPENCODE_API_KEY not set -- skipping $MEMBER ritual run."
            exit 0
          fi

          mkdir -p .agenthood
          printf '{\n  "provider": "opencode",\n  "model": "%s"\n}\n' "$OPENCODE_MODEL" > .agenthood/config.json

          # The runtime has no shell tool: the workflow collects the measurements
          # and the member only formats the report from them.
          FACTS=$(bash .github/scripts/ritual-facts.sh "$RITUAL_NAME" 2>&1 || echo "fact collection failed")
          TASK="$TASK

          The runtime session has no shell. Use only the measured facts below; do not
          re-run git or gh. If a section is empty, report it as empty.

          Measured facts:
          $FACTS"

          npm ci --ignore-scripts
          npm run build

          echo "## The $RITUAL_NAME ritual - $MEMBER" >> "$GITHUB_STEP_SUMMARY"
          node dist/cli.js run "$MEMBER" "$TASK" --provider opencode 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
