name: The Herald — Semantic Release

# Two-phase release: repository rulesets forbid direct commits to main, which
# made the old single-job semantic-release flow fail on every push — its git
# plugin attempts to push a version-bump commit straight to main in its
# prepare step, and because prepare precedes publish, tags, npm publish, and
# GitHub releases were all silently skipped once the ruleset landed. Instead:
#
#   release-pr  — computes the next version from conventional commits, applies
#                 the version bump + CHANGELOG + release-notes docs, and opens
#                 or refreshes a `chore(release)` PR that merges through the
#                 normal required status checks (scripts/herald-release.mjs
#                 replaces the semantic-release CLI here, calling the same
#                 commit-analyzer / release-notes-generator plugins)
#   publish     — runs when package.json is ahead of the latest v* tag (i.e. a
#                 release PR has merged): tags via the GitHub releases API
#                 (bypasses branch push rules), creates the GitHub release,
#                 and publishes to npm with OIDC provenance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: herald-release
  cancel-in-progress: false

jobs:
  release-pr:
    name: The Herald — open release PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: The Warden — typecheck
        run: npm run typecheck

      - name: Audit dependencies for vulnerabilities
        run: npm audit --audit-level=high || echo "::warning::npm audit found vulnerabilities"

      - name: The Herald — compute next version
        id: version
        run: |
          node scripts/herald-release.mjs compute herald.json
          VERSION=$(jq -r '.version // empty' herald.json)
          if [ -z "$VERSION" ]; then
            echo "herald: no release pending — skipping release PR"
          else
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: The Herald — prepare release artifacts
        if: steps.version.outputs.version != ''
        run: node scripts/herald-release.mjs apply "${{ steps.version.outputs.version }}"

      - name: The Herald — release notes for the PR body
        if: steps.version.outputs.version != ''
        run: node scripts/herald-release.mjs notes "${{ steps.version.outputs.version }}" > herald-notes.md

      - name: The Herald — clean generated notes (drop false closures, linkified refs)
        if: steps.version.outputs.version != ''
        run: npx tsx scripts/clean-herald-notes.ts herald-notes.md herald-notes.md

      - name: The Herald — gate the generated artifacts
        if: steps.version.outputs.version != ''
        run: |
          # This PR is opened with GITHUB_TOKEN, and GitHub starts no workflow
          # for a GITHUB_TOKEN push, so pr.yml never runs on the regenerated
          # head. repository_dispatch is suppressed by the same guard, so there
          # is no token-free way to get CI onto it. Whatever must be checked
          # about these artifacts is therefore checked here, before the PR
          # exists.
          npx vitest run tests/release-config.test.ts

          # The notes have been cleaned by cleanLine — false closing keywords
          # and linkified references are stripped. The gate now only catches
          # genuine unprocessed closing keywords (which should not exist).
          if grep -inE '\b(clos(e|es|ed)|fix(es|ed)?|resolv(e|es|ed))\b[[:space:]]+\[?#[0-9]+' herald-notes.md; then
            echo "::error::herald-notes.md carries a closing keyword after cleaning; merging this PR would close those issues"
            exit 1
          fi

          # cleanLine rewrites every linkified ref ([#N](url)) into a bare #N
          # inside a "refs" list. Anything left still linkified is a ref the
          # generator or cleanLine did not understand.
          if grep -nE '\[#[0-9]+\]\([^)]*\)' herald-notes.md; then
            echo "::error::herald-notes.md carries a linkified reference cleanLine did not rewrite"
            exit 1
          fi

      - name: The Herald — open or refresh release PR
        if: steps.version.outputs.version != ''
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/release-bump
          base: main
          commit-message: "chore(release): v${{ steps.version.outputs.version }}"
          title: "chore(release): v${{ steps.version.outputs.version }}"
          body-path: herald-notes.md
          labels: release

  publish:
    name: The Herald — tag and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: The Warden — typecheck
        run: npm run typecheck

      # No `needs:` — this job is independently gated: a normal push to main has
      # nothing pending (package.json == latest tag) and stays a green no-op,
      # while the push of a merged release PR has a pending bump to publish.
      # npm ci must run before this check: the helper imports semver and the
      # @semantic-release plugins at module load.
      - name: The Herald — check for a pending release
        id: pending
        run: |
          if node scripts/herald-release.mjs pending; then
            echo "state=true" >> "$GITHUB_OUTPUT"
          else
            echo "state=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure npm for OIDC
        if: steps.pending.outputs.state == 'true'
        run: |
          echo "registry=https://registry.npmjs.org/" > ~/.npmrc
          echo "provenance=true" >> ~/.npmrc

      - name: The Herald — build dist for the publishable package
        if: steps.pending.outputs.state == 'true'
        run: npm run build

      - name: The Herald — generate release notes
        if: steps.pending.outputs.state == 'true'
        run: node scripts/herald-release.mjs notes > herald-notes.md

      - name: The Herald — clean release notes before tagging
        if: steps.pending.outputs.state == 'true'
        run: npx tsx scripts/clean-herald-notes.ts herald-notes.md herald-notes.md

      - name: The Herald — gate the generated artifacts
        if: steps.pending.outputs.state == 'true'
        run: |
          # The notes are cleaned by cleanLine, so false closing keywords
          # and linkified refs are stripped. This gate is the same one
          # that runs before the release PR opens (release-pr job), here
          # as a safety net on the notes that actually reach the GitHub
          # release and npm package.
          npx vitest run tests/release-config.test.ts
          # Gate 1: no closing keywords remain after cleanLine
          if grep -inE '\b(clos(e|es|ed)|fix(es|ed)?|resolv(e|es|ed))\b[[:space:]]+\[?#[0-9]+' herald-notes.md; then
            echo "::error::herald-notes.md carries a closing keyword after cleaning; the published release would close those issues"
            exit 1
          fi
          # Gate 2: no linkified refs cleanLine did not rewrite
          # cleanLine rewrites every linkified ref ([#N](url)) into a
          # bare #N inside a "refs" list. Anything left linkified is a
          # ref the generator or cleanLine did not understand.
          if grep -nE '\[#[0-9]+\]\([^)]*\)' herald-notes.md; then
            echo "::error::herald-notes.md carries a linkified reference cleanLine did not rewrite"
            exit 1
          fi

      - name: The Herald — tag and create GitHub release
        if: steps.pending.outputs.state == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v$VERSION" --title "v$VERSION" --notes-file herald-notes.md --target "$GITHUB_SHA"

      - name: The Herald — publish to npm
        if: steps.pending.outputs.state == 'true'
        run: npm publish

      - name: The Herald — verify published version
        if: steps.pending.outputs.state == 'true'
        run: |
          # The registry/CDN can lag the publish by minutes — a fixed sleep
          # flakes whenever propagation exceeds it (seen on v3.65.0: 20s was
          # not enough). Poll instead; ~5 min window fits the job timeout.
          VERSION=$(node -p "require('./package.json').version")
          for i in $(seq 1 10); do
            PUBLISHED=$(npm view agenthood version 2>/dev/null || true)
            if [ "$PUBLISHED" = "$VERSION" ]; then
              echo "Published agenthood@$VERSION"
              exit 0
            fi
            echo "Attempt $i/10: npm shows ${PUBLISHED:-<none>}, expected $VERSION — retrying in 30s"
            sleep 30
          done
          echo "::error::npm still shows ${PUBLISHED:-<none>} after 5 minutes, expected $VERSION"
          exit 1
