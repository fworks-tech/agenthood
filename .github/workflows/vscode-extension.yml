name: The Envoy — VS Code Extension Build and Test

on:
  pull_request:
    branches: [main]
    paths:
      - "vscode-extension/**"
      - ".github/workflows/vscode-extension.yml"
  push:
    branches: [main]
    paths:
      - "vscode-extension/**"
      - ".github/workflows/vscode-extension.yml"

jobs:
  build:
    name: The Envoy — build and test VS Code Extension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Install dependencies
        run: cd vscode-extension && npm ci

      - run: cd vscode-extension && npm audit --audit-level=high || echo "::warning::vscode-extension npm audit found vulnerabilities"

      - name: Build extension
        run: cd vscode-extension && npm run build

      - name: Install Linux dependencies for headless VS Code
        run: sudo apt-get update && sudo apt-get install -y xvfb libasound2t64 libgbm1 libgtk-3-0 libnss3

      - name: Run tests
        run: cd vscode-extension && xvfb-run -a npm test

      - name: Package extension
        run: cd vscode-extension && npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: agenthood-vscode-vsix
          path: vscode-extension/agenthood-vscode-*.vsix
          retention-days: 30
