# Agenthood Live orchestration chains.
# Members route and sequence; infra skills appear exclusively
# under tools:, never as chain nodes. Guards are policy: a standing block
# stops the chain, and merges/commits require their gatekeeper.
chains:
  - name: build
    sequence:
      - member: tester
      - member: builder
      - member: reviewer
      - member: doorman
    guards: { stop_on_blocking: true, doorman_before_merge: true, scribe_before_commit: true }
    max_rounds: 3
  - name: review
    sequence:
      - member: reviewer
      - member: auditor
      - member: warden
    guards: { stop_on_blocking: true, doorman_before_merge: true, scribe_before_commit: true }
    max_rounds: 3
  - name: security
    sequence:
      - member: auditor
        tools: [sentry]
      - member: warden
      - member: scribe
    guards: { stop_on_blocking: true, doorman_before_merge: true, scribe_before_commit: true }
    max_rounds: 3
  - name: planning
    sequence:
      - member: strategist
      - member: architect
      - member: tester
      - member: builder
    guards: { stop_on_blocking: true, doorman_before_merge: true, scribe_before_commit: true }
    max_rounds: 3
  - name: bug
    sequence:
      - member: debugger
        tools: [sentry]
      - member: tester
      - member: reviewer
    guards: { stop_on_blocking: true, doorman_before_merge: true, scribe_before_commit: true }
    max_rounds: 3
  - name: release
    sequence:
      - member: scribe
        tools: [github]
      - member: herald
        tools: [github]
    guards: { stop_on_blocking: true, doorman_before_merge: true, scribe_before_commit: true }
    max_rounds: 3
  - name: authoring
    sequence:
      - member: oracle
      - member: sentinel
      - member: builder
    guards: { stop_on_blocking: true, doorman_before_merge: true, scribe_before_commit: true }
    max_rounds: 3
  - name: full
    sequence:
      - member: strategist
      - member: architect
      - member: tester
      - member: builder
      - member: reviewer
      - member: auditor
      - member: warden
      - member: doorman
      - member: scribe
      - member: herald
      - member: librarian
    guards: { stop_on_blocking: true, doorman_before_merge: true, scribe_before_commit: true }
    max_rounds: 3
  - name: incident-triage
    sequence:
      - member: mediator
      - member: debugger
        tools: [sentry]
      - member: tester
        tools: [postgres]
      - member: builder
    guards: { stop_on_blocking: true, doorman_before_merge: true, scribe_before_commit: true }
    max_rounds: 3
